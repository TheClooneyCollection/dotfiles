# tmux-agents: key bindings, hooks and status line settings.
#
# Source it from ~/.tmux.conf:
#
#   %hidden TMUX_AGENTS_BIN="$HOME/.local/bin"   # where the tmux-* commands are
#   source-file ~/path/to/tmux-agents/tmux/tmux-agents.conf
#
# TMUX_AGENTS_BIN defaults to ~/.local/bin, where install.sh links them.

%if "#{==:$TMUX_AGENTS_BIN,}"
%hidden TMUX_AGENTS_BIN="$HOME/.local/bin"
%endif

# prefix + a: browse agents (live preview, open, jump, dismiss).
bind a run-shell -b "tmux display-popup -c '#{client_name}' -E -w 90% -h 80% -T ' agents ' '$TMUX_AGENTS_BIN/tmux-agents --client #{client_name}'"

# prefix + A: connect this pane to another one, from a picker.
bind A run-shell -b "tmux display-popup -c '#{client_name}' -E -w 70% -h 40% -T ' tmux-connect ' '$TMUX_AGENTS_BIN/tmux-connect --popup --from #{pane_id}'"

# Refresh the "name ⇄ peers" border labels when a connected pane goes away.
set-hook -g pane-exited[42] "run-shell -b '$TMUX_AGENTS_BIN/tmux-peers --refresh'"
set-hook -g after-kill-pane[42] "run-shell -b '$TMUX_AGENTS_BIN/tmux-peers --refresh'"

# Leaving copy mode (mouse or keys) sends tmux-ask messages queued for that pane.
set-hook -g pane-mode-changed[42] "run-shell -b '$TMUX_AGENTS_BIN/tmux-ask --kick #{pane_id}'"

# Tell visible clients when a hidden agent rings the bell.
set-hook -g alert-bell[42] "run-shell -b '$TMUX_AGENTS_BIN/tmux-agents --alert #{session_name} #{window_name}'"

# The sub agent chip, a status line above yours while sub agents exist.
# Above 1 frame a second a background process pushes it (smooth spinner);
# 1 lets tmux re-run it every status-interval instead.
set -g status-interval 1
set -g @tmux_agents_chip_fps 10
